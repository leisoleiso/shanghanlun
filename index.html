<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="description" content="《伤寒论》宋本 398 条原文，附方剂组成、煎服法与注意事项，逐条阅读，可查看上下文">
<title>伤寒论 · 逐条阅读</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="progress" id="progress"></div>
  <div class="topbar-inner">
    <div class="top-row">
      <h1 class="brand">伤寒论</h1>
      <div class="hud">
        <button id="font-dec" title="缩小字号" aria-label="缩小字号">A−</button>
        <button id="font-inc" title="放大字号" aria-label="放大字号">A+</button>
        <button id="theme-btn" title="切换主题" aria-label="切换主题">◐</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm8 14-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="搜索条文 / 方剂 / 药味 / 症状…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button id="clear-search" class="clear-btn" aria-label="清空" hidden>×</button>
      </div>
    </div>
    <div class="toolbar second">
      <select id="book-filter" aria-label="按书筛选">
        <option value="">全部（伤寒论 + 金匮要略）</option>
      </select>
      <select id="category-filter" aria-label="按篇筛选">
        <option value="">全部</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div id="symptom-results" class="symptom-results" hidden></div>
  <div id="result-meta" class="result-meta"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>无匹配结果</div>
</main>

<footer class="footer">
  据宋本《伤寒论》398 条整理 · 附 113 方组成、煎服法与注意事项 · 内容请以权威版本为准
</footer>

<button id="back-top" class="back-top fab" title="回到顶部" aria-label="回到顶部" hidden>↑</button>

<!-- 详情弹层 -->
<div id="modal" class="modal" hidden>
  <div class="modal-mask" data-act="close"></div>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <button class="modal-close" data-act="close" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="jingui.js"></script>
<script src="formulas.js"></script>
<script src="jingui-formulas.js"></script>
<script src="symptoms.js"></script>
<script src="app.js"></script>
</body>
</html>
